# Publica o app a cada push na main (e pelo botão "Run workflow" na aba Actions):
# 1. build (TypeScript + Vite) — se falhar, nada é publicado
# 2. aplica as migrações novas no Supabase (supabase/migrations)
# 3. envia o dist para o Cloudflare Pages (projeto financas-app)
#
# Segredos necessários em Settings → Secrets and variables → Actions:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (os mesmos do .env.local)
#   SUPABASE_PROJECT_ID, SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrações do banco
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name financas-app --branch main
